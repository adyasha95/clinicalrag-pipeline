name: CI / Deploy

on:
  push:
    branches: [main]

env:
  REGION: europe-west3
  REGISTRY: europe-west3-docker.pkg.dev
  REPO: clinicalrag/app

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v
        env:
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
          PINECONE_API_KEY: dummy
          PINECONE_INDEX_NAME: dummy
          PINECONE_ENVIRONMENT: dummy

  # ── 2. Build & push ─────────────────────────────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

  # ── 3. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Deploy
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}:${{ github.sha }}"
          gcloud run deploy clinicalrag-prod \
            --image "$IMAGE_TAG" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --min-instances 0 \
            --max-instances 3 \
            --memory 1Gi \
            --allow-unauthenticated \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest,PINECONE_ENVIRONMENT=PINECONE_ENVIRONMENT:latest \
            --quiet
