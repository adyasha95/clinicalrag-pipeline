name: CI / Deploy

on:
  push:
    branches: [main]

env:
  REGION: europe-west3
  REGISTRY: europe-west3-docker.pkg.dev
  IMAGE: europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/clinicalrag/app

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Tests mock external services — dummy values satisfy any env checks
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
          PINECONE_API_KEY: dummy
          PINECONE_INDEX_NAME: dummy
          PINECONE_ENVIRONMENT: dummy

  # ── 2. Build & push ─────────────────────────────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write        # required for Workload Identity Federation

    outputs:
      image: ${{ steps.tag.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push
        id: tag
        run: |
          IMAGE_TAG="${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "image=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── 3. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: clinicalrag-prod
          region: ${{ env.REGION }}
          image: ${{ needs.build.outputs.image }}
          flags: >-
            --min-instances=0
            --max-instances=3
            --memory=1Gi
            --allow-unauthenticated
            --update-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest,PINECONE_ENVIRONMENT=PINECONE_ENVIRONMENT:latest
